name: Cập nhật products.json từ Google Sheet

on:
  schedule:
    - cron: '*/10 * * * *'   # mỗi 10 phút (GitHub có thể trễ vài phút khi đông)
  workflow_dispatch:          # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: write

# Không chạy chồng nhiều lần cùng lúc
concurrency:
  group: update-products
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Lấy dữ liệu và nén ảnh. Mã thoát 42 = có ảnh mới cần nén mà máy chưa có ffmpeg:
      # khi đó mới cài ffmpeg rồi chạy lại (nhờ vậy phần lớn các lần chạy rất nhanh).
      - name: Lấy dữ liệu từ Google Sheet và nén ảnh
        run: |
          code=0
          node scripts/build-products.js || code=$?
          if [ "$code" -eq 42 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
            node scripts/build-products.js
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Commit nếu có thay đổi
        run: |
          if [ -n "$(git status --porcelain products.json img)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A products.json img
            git commit -m "cap nhat products.json tu Google Sheet"
            git push
          else
            echo "Không có thay đổi."
          fi
