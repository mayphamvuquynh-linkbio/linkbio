<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Thẻ tối ưu hiển thị khi share link lên mạng xã hội -->
    <meta property="og:title" content="Phạm Vũ Quỳnh Mây | Link Bio & Review">
    <meta property="og:description" content="Tổng hợp đồ xinh tui mặc, các nàng nhập mã để tìm đồ nha!">
    <meta property="og:image" content="profile_phamvuquynhmay.png">
    <meta property="og:type" content="website">
    
    <!-- Favicon SVG màu trắng, không có vòng tròn nền -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g transform='translate(4, 4) scale(1)'><path d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71' fill='none' stroke='%23FFFFFF' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/><path d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71' fill='none' stroke='%23FFFFFF' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/></g></svg>">
    
    <!-- Liên kết đến file CSS bên ngoài -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Bắt buộc khung chứa chính có position: relative để nút con định vị chuẩn xác bên trong -->
    <div class="bio-container" style="position: relative;">
        <!-- 1. Ảnh bìa (Cover photo) -->
        <div class="cover-photo">
            <img src="generated-images__link-in-bio__header-block__home__155e7f6a-af6e-482b-82a9-f696f2c221dc__448709b6-f2b4-4eed-a0bf-a99daf469901.webp" alt="Cover">
        </div>
        <!-- 2. Avatar tròn -->
        <div class="avatar-wrapper">
            <img src="profile_phamvuquynhmay.png" alt="Avatar">
        </div>
        <!-- 3. Tên và Bio -->
        <div class="profile-info">
            <h1>Phạm Vũ Quỳnh Mây</h1>
            <p>Contact for work</p>
        </div>
        <!-- 4. Các nút mạng xã hội -->
        <div class="social-icons">
            <a href="https://www.instagram.com/pvq.may_/" target="_blank" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@phamvuquynhmay" target="_blank" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://www.facebook.com/maidaily.doxinh" target="_blank" title="Facebook"><i class="fa-brands fa-square-facebook"></i></a>
            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=mayphamvuquynhmay@gmail.com" target="_blank" title="Email"><i class="fa-regular fa-envelope"></i></a>
        </div>
        <!-- 5. Tiêu đề và Ô tìm kiếm mã sản phẩm -->
        <div class="search-section">
            <p class="search-label"><i>Đồ tui mặc bên dưới nha </i>⤵️</p>
            <form onsubmit="event.preventDefault(); searchAndScroll();">
                <input type="search" id="searchCodeInput" placeholder="các nàng nhập mã tìm đồ nha..." maxlength="4" enterkeyhint="search">
            </form>
            <!-- Dòng chữ thông báo lỗi hiện trực tiếp, không bị Messenger chặn -->
            <div id="searchMessage" style="color: #ffffff; font-size: 15px; margin-top: 8px; text-align: center; font-family: Arima Madurai; min-height: 22px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.4);"></div>
        </div>
        <!-- 6. Khu vực chứa danh sách sản phẩm (Sẽ được JavaScript tự động điền vào đây) -->
        <div id="product-list" class="product-list">
            <!-- Sản phẩm sẽ hiện ở đây -->
        </div>

       <!-- Nút nổi quay lại chỉ còn icon mũi tên -->
            <button id="backToTopBtn" onclick="scrollToSearch()" title="Quay lại tìm kiếm">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
    </div>

    <!-- Liên kết đến file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
